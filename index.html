<html>
<head>    
	<meta name="viewport" id="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<script src="/socket.io/socket.io.js"></script>
</head>

<body onload="loaded()">
	<div id="message"></div>

	<div id="connectionbox">
		<input id="room" value="room1">
	</div>
	
	<div id="buttonbox">
		<input id="btn" type="button" value="OK" onclick="buttonHit()">
	</div>
	
	<div id="playerslist"></div>
	
	<div id="settings">
		<input type="checkbox" id="alwaysplayaudio"> Always play audio<br>
		<input type="checkbox" id="disableblink"> Disable blink<br>
		<input type="checkbox" id="disablevibrate"> Disable vibrate
	</div>

	<div id="log"></div>

</body>	
</html>
